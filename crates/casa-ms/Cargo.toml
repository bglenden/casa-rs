[package]
name = "casa-ms"
description = "Typed MeasurementSet (MS) API for radio interferometry data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[features]
default = []
slow-tests = []
cpp-interop-tests = ["casa-test-support/cpp-interop-tests"]
performance-tests = ["casa-test-support/performance-tests"]
# The trial MSv4 (XRADIO VisibilityXds 4.0.1, local Zarr v3) adapter
# (docs/measurement-set/trial/README.md).
msv4 = ["dep:zarrs", "dep:zarrs_filesystem", "dep:bytemuck", "dep:unsafe_cell_slice"]

[dependencies]
casa-coordinates = { path = "../casa-coordinates" }
casa-imaging-model = { path = "../casa-imaging-model" }
casa-logging = { path = "../casa-logging" }
casa-measures-data = { path = "../casa-measures-data" }
casa-numerics = { path = "../casa-numerics" }
casa-observation = { path = "../casa-observation" }
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-simulation-synthesis = { path = "../casa-simulation-synthesis" }
casa-tables = { path = "../casa-tables" }
casa-types = { path = "../casa-types" }
libc = "0.2"
libm = "0.2"
ndarray.workspace = true
num-complex = { workspace = true, features = ["bytemuck"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sofars.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytemuck = { version = "1.25", optional = true }
unsafe_cell_slice = { version = "=0.2.2", optional = true }
zarrs = { version = "=0.23.14", default-features = false, features = ["filesystem", "blosc", "zstd"], optional = true }
# The store zarrs re-exports as `zarrs::filesystem`, pinned beside it: its
# per-key lock registry and file handling are what the trial audited
# (docs/measurement-set/trial/README.md, "Converter").
zarrs_filesystem = { version = "=0.3.14", optional = true }

[dev-dependencies]
casa-observation = { path = "../casa-observation" }
casa-test-support = { path = "../casa-test-support" }
flate2 = "1"
tar = "0.4"
tempfile = "3"

[[bin]]
name = "msexplore"
path = "src/bin/msexplore.rs"

[[bin]]
name = "mstransform"
path = "src/bin/mstransform.rs"

[[bin]]
name = "flagdata"
path = "src/bin/flagdata.rs"

[[bin]]
name = "flagmanager"
path = "src/bin/flagmanager.rs"

[[bin]]
name = "simobserve"
path = "src/bin/simobserve.rs"

# The synthetic MeasurementSet generator as a developer tool; not a catalog
# task, and not installed with the suite.
[[bin]]
name = "synthetic-ms"
path = "src/bin/synthetic-ms.rs"

[[bin]]
name = "ms-read-probe"
path = "src/bin/ms-read-probe.rs"

[lints]
workspace = true

[[example]]
name = "ms_trial_interop"
required-features = ["msv4"]

[[example]]
name = "ms_trial_convert"
required-features = ["msv4"]

[[example]]
name = "ms_trial_read_passes"
required-features = ["msv4"]

[[example]]
name = "ms_trial_update_pass"
required-features = ["msv4"]

