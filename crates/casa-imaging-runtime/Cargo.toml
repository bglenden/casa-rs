[package]
name = "casa-imaging-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Process resource authority for CASA-compatible imaging"
repository.workspace = true

[lints]
workspace = true

[dependencies]
casa-imaging-model = { path = "../casa-imaging-model" }
casa-imaging-products = { path = "../casa-imaging-products" }
casa-imaging-reconstruction = { path = "../casa-imaging-reconstruction" }
num-complex.workspace = true
casa-ms = { path = "../casa-ms" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
casa-test-support = { path = "../casa-test-support" }

[target.'cfg(all(target_os = "macos", not(coverage)))'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLCommandQueue",
    "MTLDevice",
] }
