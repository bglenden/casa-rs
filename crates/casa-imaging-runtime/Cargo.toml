[package]
name = "casa-imaging-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Process resource authority for CASA-compatible imaging"
repository.workspace = true

[lints]
workspace = true

[dependencies]
casa-imaging-model = { path = "../casa-imaging-model" }
casa-imaging-products = { path = "../casa-imaging-products" }
casa-imaging-reconstruction = { path = "../casa-imaging-reconstruction" }
casa-lattices = { path = "../casa-lattices" }
casa-tables = { path = "../casa-tables" }
ndarray.workspace = true
num-complex.workspace = true
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
casa-ms = { path = "../casa-ms" }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
casa-test-support = { path = "../casa-test-support" }
casa-types = { path = "../casa-types" }

[target.'cfg(all(target_os = "macos", not(coverage)))'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-metal-performance-shaders = { version = "0.3.2", default-features = false, features = ["std", "MPSCoreTypes"] }
objc2-metal-performance-shaders-graph = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-metal-performance-shaders", "MPSGraph", "MPSGraphCore",
    "MPSGraphDevice", "MPSGraphExecutable", "MPSGraphFourierTransformOps",
    "MPSGraphArithmeticOps", "MPSGraphOperation", "MPSGraphTensor",
    "MPSGraphTensorData", "MPSGraphTensorShapeOps", "MPSGraphMemoryOps",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError", "NSArray", "NSDictionary", "NSValue"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePass",
    "MTLComputePipeline",
    "MTLCounters",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
