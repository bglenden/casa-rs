[package]
name = "casa-imaging"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Production composition seam for native CASA-RS imaging"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["radio-astronomy", "interferometry", "imaging"]
categories = ["science"]
publish = true
autotests = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
casa-imageanalysis.workspace = true
tracing.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-imaging-deconvolution.workspace = true
casa-imaging-model.workspace = true
casa-imaging-operator.workspace = true
casa-imaging-products.workspace = true
casa-imaging-runtime.workspace = true
casa-imaging-singledish.workspace = true
casa-numerics.workspace = true
# An MSv4 processing set images as a MeasurementSet does (#932, 6c).
casa-ms = { workspace = true, features = ["msv4"] }
casa-observation.workspace = true
casa-core.workspace = true
ndarray.workspace = true
num-complex.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
casa-mstransform = { workspace = true, features = ["msv4"] }
casa-simulation = { path = "../../casa/casa-simulation" }
base64 = "0.22"
flate2 = "1"
tar = "0.4"
casa-imaging-metal.workspace = true
casa-tables.workspace = true
casa-test-support = { path = "../../../dev/casa-test-support" }
sha2 = "0.10"
tempfile = "3"
tracing-subscriber.workspace = true

[[test]]
name = "api"
path = "tests/api.rs"

[[test]]
name = "admission_memory"
path = "tests/admission_memory.rs"
