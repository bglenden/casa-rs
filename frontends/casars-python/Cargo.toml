[package]
name = "casars-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings and package for casa-rs"
repository.workspace = true
publish = false

[lib]
name = "casars_python"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
casa-atmosphere = { path = "../../crates/casa-atmosphere" }
casa-calibration = { path = "../../crates/casa-calibration" }
casa-components = { path = "../../crates/casa-components" }
casa-coordinates = { path = "../../crates/casa-coordinates" }
casa-images = { path = "../../crates/casa-images" }
casa-lattices = { path = "../../crates/casa-lattices" }
casa-measures-data = { path = "../../crates/casa-measures-data" }
casa-ms = { path = "../../crates/casa-ms" }
casa-contracts = { path = "../../surfaces/casa-contracts" }
casa-plot-data = { path = "../../surfaces/casa-plot-data", features = ["ms", "simulation"] }
casa-simulation = { path = "../../crates/casa-simulation" }
casa-tables = { path = "../../crates/casa-tables" }
casa-tasks = { path = "../../surfaces/casa-tasks", features = ["calibration", "imaging", "images", "ms", "simulation", "vla"] }
casa-types = { path = "../../crates/casa-types" }
ndarray.workspace = true
num-complex.workspace = true
numpy = "0.28"
# `multiple-pymethods`: a CASA tool's methods are declared across files, its
# generated refusals apart from what it implements (#1025).
pyo3 = { version = "0.28", features = ["multiple-pymethods"] }
pythonize = "0.28"
regex = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
