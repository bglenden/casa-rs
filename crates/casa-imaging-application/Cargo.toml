[package]
name = "casa-imaging-application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Production composition seam for native CASA-RS imaging"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
casa-imageanalysis.workspace = true
tracing.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-imaging-deconvolution = { path = "../casa-imaging-deconvolution" }
casa-imaging-model = { path = "../casa-imaging-model" }
casa-imaging-operator = { path = "../casa-imaging-operator" }
casa-imaging-products = { path = "../casa-imaging-products" }
casa-imaging-runtime = { path = "../casa-imaging-runtime" }
casa-imaging-singledish = { path = "../casa-imaging-singledish" }
casa-numerics.workspace = true
# An MSv4 processing set images as a MeasurementSet does (#932, 6c).
casa-ms = { path = "../casa-ms", features = ["msv4"] }
casa-observation.workspace = true
casa-core.workspace = true
ndarray.workspace = true
num-complex.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
casa-simulation = { path = "../casa-simulation" }
base64 = "0.22"
flate2 = "1"
tar = "0.4"
casa-imaging-metal = { path = "../casa-imaging-metal" }
casa-tables.workspace = true
casa-test-support = { path = "../../dev/casa-test-support" }
sha2 = "0.10"
tempfile = "3"
tracing-subscriber.workspace = true
