[package]
name = "casacore-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in 2x2 RR/RC/CR/CC C++ casacore interop test suite (internal)"
repository.workspace = true
publish = false
autotests = false

[features]
default = []
cpp-interop-tests = ["casa-test-support/cpp-interop-tests"]

[lints]
workspace = true

[dependencies]
casa-vla.workspace = true
casa-observation.workspace = true
num-complex.workspace = true
casa-aipsio.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-lattices.workspace = true
casa-measures.workspace = true
casa-ms.workspace = true
casa-tables.workspace = true
casa-test-support = { path = "../../dev/casa-test-support" }
casa-core.workspace = true
ndarray.workspace = true
sofars.workspace = true
tempfile = "3"
thiserror.workspace = true

[build-dependencies]
pkg-config.workspace = true

# A held-open C++ casacore reader for the locking interop tests, which run it
# in its own process.
[[bin]]
name = "casacore-held-table-reader"
path = "src/bin/casacore-held-table-reader.rs"
required-features = ["cpp-interop-tests"]

