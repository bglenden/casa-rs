[package]
name = "casa-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Feature-gated task adapters, contracts, parameter runtime, and CASA return projections for casa-rs"
repository.workspace = true
publish = false

[features]
default = []
calibration = [
    "ms",
    "casa-plot-data/calibration",
    "dep:casa-calibration",
    "dep:casa-components",
    "dep:time",
    "dep:ureq",
]
imaging = [
    "dep:casa-images",
    "dep:casa-imaging-application",
    "dep:casa-ms",
    "dep:ndarray",
]
images = [
    "dep:casa-imageanalysis",
    "dep:casa-images",
    "dep:casa-lattices",
]
ms = [
    "dep:casa-atmosphere",
    "dep:casa-measures",
    "dep:casa-ms",
    "dep:casa-numerics",
    "dep:casa-observation",
    "dep:casa-plot-data",
    "dep:ndarray",
    "dep:num-complex",
    "dep:tempfile",
]
simulation = [
    "ms",
    "casa-plot-data/simulation",
    "dep:casa-calibration",
    "dep:casa-components",
    "dep:casa-measures",
    "dep:casa-ms",
    "dep:casa-simulation",
]
vla = ["dep:casa-ms", "dep:casa-vla"]

[lints]
workspace = true

[dependencies]
casa-atmosphere = { path = "../../crates/casa-atmosphere", optional = true }
casa-calibration = { path = "../../crates/casa-calibration", optional = true }
casa-components = { workspace = true, optional = true }
casa-contracts = { path = "../casa-contracts" }
casa-imageanalysis = { workspace = true, optional = true }
casa-images = { workspace = true, optional = true }
casa-imaging-application = { path = "../../crates/casa-imaging-application", optional = true }
casa-lattices = { workspace = true, optional = true }
casa-measures = { workspace = true, optional = true }
casa-ms = { path = "../../crates/casa-ms", features = ["msv4"], optional = true }
casa-numerics = { workspace = true, optional = true }
casa-observation = { workspace = true, optional = true }
casa-plot-data = { path = "../casa-plot-data", features = ["ms"], optional = true }
casa-simulation = { path = "../../crates/casa-simulation", optional = true }
casa-tables.workspace = true
casa-core.workspace = true
casa-vla = { path = "../../crates/casa-vla", optional = true }
fs2 = "0.4"
ndarray = { workspace = true, optional = true }
num-complex = { workspace = true, optional = true }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = { version = "3", optional = true }
thiserror.workspace = true
time = { version = "0.3", features = ["local-offset"], optional = true }
toml = "0.8"
tracing.workspace = true
ureq = { version = "3", optional = true }

[dev-dependencies]
casa-imaging-deconvolution = { path = "../../crates/casa-imaging-deconvolution" }
casa-test-support = { path = "../../dev/casa-test-support" }
tempfile = "3"
