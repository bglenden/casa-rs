[package]
name = "casa-imaging-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Metal implementation of the imaging gridding backend (macOS only)"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["metal", "gpu", "interferometry"]
categories = ["science"]
publish = true
autotests = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
casa-imaging-operator.workspace = true
casa-numerics.workspace = true
num-complex.workspace = true
tracing.workspace = true

[target.'cfg(all(target_os = "macos", not(coverage)))'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]
casa-imaging-model.workspace = true
casa-core.workspace = true
ndarray.workspace = true
num-complex.workspace = true

[[test]]
name = "api"
path = "tests/api.rs"
