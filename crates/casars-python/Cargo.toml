[package]
name = "casars-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings and package for casa-rs"
repository.workspace = true
publish = false

[lib]
name = "casars_python"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
casa-aipsio = { path = "../casa-aipsio" }
casa-atmosphere = { path = "../casa-atmosphere" }
casa-calibration = { path = "../casa-calibration" }
casa-components = { path = "../casa-components" }
casa-coordinates = { path = "../casa-coordinates" }
casa-images = { path = "../casa-images" }
casa-lattices = { path = "../casa-lattices" }
casa-measures-data = { path = "../casa-measures-data" }
casa-ms = { path = "../casa-ms" }
casa-contracts = { path = "../../surfaces/casa-contracts" }
casa-simulation = { path = "../casa-simulation" }
casa-tables = { path = "../casa-tables" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-tasks = { path = "../../surfaces/casa-tasks", features = ["imaging", "images", "vla"] }
casa-types = { path = "../casa-types" }
casars-simulation = { path = "../casars-simulation" }
ndarray.workspace = true
num-complex.workspace = true
numpy = "0.28"
# `multiple-pymethods`: a CASA tool's methods are declared across files, its
# generated refusals apart from what it implements (#1025).
pyo3 = { version = "0.28", features = ["multiple-pymethods"] }
pythonize = "0.28"
regex = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
casars-msconvert = { path = "../casars-msconvert" }

[lints]
workspace = true
