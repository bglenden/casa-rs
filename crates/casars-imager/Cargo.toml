[package]
name = "casars-imager"
default-run = "casars-imager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MeasurementSet-backed CASA-compatible imaging application"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tracing.workspace = true
ndarray.workspace = true
casa-images = { path = "../casa-images" }
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-imaging-application = { path = "../casa-imaging-application" }
libc = "0.2"
casa-ms = { path = "../casa-ms" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Names the parameter a request's domain read refuses.
serde_path_to_error = "0.1"

[dev-dependencies]
casa-simulation = { path = "../casa-simulation" }
base64 = "0.22"
flate2 = "1"
# T1's store law converts a track to MSv4 and reads it back.
casa-ms = { path = "../casa-ms", features = ["msv4"] }
casa-logging = { path = "../casa-logging" }
casa-coordinates = { path = "../casa-coordinates" }
# T1's cube law measures each PSF plane's sidelobe as the minor cycle does.
casa-imaging-deconvolution = { path = "../casa-imaging-deconvolution" }
casa-numerics = { path = "../casa-numerics" }
casa-tables = { path = "../casa-tables" }
casa-test-support = { path = "../../dev/casa-test-support" }
casa-types = { path = "../casa-types" }
tempfile = "3"
tracing-subscriber.workspace = true

[[bin]]
name = "casars-imager"
path = "src/main.rs"
