name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Runs on main warm the Rust build caches that pull requests restore.
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint_test:
    runs-on: ubuntu-latest
    env:
      # Line tables keep file:line in panic backtraces while avoiding full
      # debug info in ~130 linked test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Make PyO3's cached configuration follow the interpreter installed
      # below, even when ubuntu-latest changes its system Python.
      PYO3_PYTHON: python3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # arch-check resolves the reviewed CASA-compatibility evidence at
          # its pinned commits (scripts/casa_compat_semantics.py).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for Rust tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check architecture
        run: scripts/arch-check.sh

      - name: Check SPDX license headers
        run: scripts/check-spdx.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install explicit measures runtime for integration tests
        run: |
          mkdir -p "$RUNNER_TEMP/casa-measures"
          tar -xzf crates/casa-measures-data/data/casa-measures-runtime.tar.gz -C "$RUNNER_TEMP/casa-measures"
          cp crates/casa-measures-data/data/casa-measures-runtime.provenance.json "$RUNNER_TEMP/casa-measures/.casa-rs-measures-provenance.json"
          echo "CASA_RS_MEASURESPATH=$RUNNER_TEMP/casa-measures" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        env:
          NEXTEST_PROFILE: ci
          # Debug builds of the bounded imaging stack legitimately exceed the
          # default test-thread stack; production uses release frames.
          RUST_MIN_STACK: 33554432
        run: scripts/test-workspace.sh

  python_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test Python package
        run: scripts/test-python-package.sh

  perf_tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the tool tests' dependencies
        run: python -m pip install pytest numpy scipy matplotlib astropy

      - name: Test the imaging performance tools
        run: scripts/test-perf-tools.sh

  docs:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build rustdoc
        # A broken or private intra-doc link fails the build rather than
        # warning (#775, #776).
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps

      - name: Build rustdoc with private items
        # The public build never resolves links in private items; this one
        # does, with the same lints (#805). Keep the public build too: only
        # it reports a public item that links to a private one.
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Build MkDocs site
        run: scripts/build-python-docs.sh site

  smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run smoke gate
        run: scripts/test-smoke.sh

  # Before merge too (#931): the real release binaries end to end, from the
  # command line and the suite's Python, with the checkout moved aside.
  suite_install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test suite installer
        run: scripts/test-install-suite.sh --hide-checkout

  coverage:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install explicit measures runtime for coverage tests
        run: |
          mkdir -p "$RUNNER_TEMP/casa-measures"
          tar -xzf crates/casa-measures-data/data/casa-measures-runtime.tar.gz -C "$RUNNER_TEMP/casa-measures"
          cp crates/casa-measures-data/data/casa-measures-runtime.provenance.json "$RUNNER_TEMP/casa-measures/.casa-rs-measures-provenance.json"
          echo "CASA_RS_MEASURESPATH=$RUNNER_TEMP/casa-measures" >> "$GITHUB_ENV"

      - name: Run coverage (line)
        run: scripts/run-coverage.sh --ci-like
