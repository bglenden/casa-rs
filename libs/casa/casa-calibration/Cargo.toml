[package]
name = "casa-calibration"
description = "Calibration-table compatibility and workflow substrate for casa-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = true
autotests = false

[dependencies]
casa-components.workspace = true
casa-flagging.workspace = true
casa-mstransform.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-lattices.workspace = true
casa-fft.workspace = true
casa-imaging-model.workspace = true
casa-imaging-operator.workspace = true
casa-imaging-runtime.workspace = true
casa-imaging-singledish.workspace = true
casa-measures.workspace = true
casa-ms.workspace = true
casa-numerics.workspace = true
casa-tables.workspace = true
casa-core.workspace = true
libm = "0.2"
ndarray.workspace = true
num-complex.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sofars.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = "3"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
csv-core = "0.1.13"

[dev-dependencies]
casa-mstransform = { workspace = true, features = ["msv4"] }
casa-simulation.workspace = true
casa-ms = { workspace = true, features = ["msv4"] }
casa-observation.workspace = true
flate2 = "1"
tar = "0.4"
casa-test-support = { path = "../../../dev/casa-test-support" }
ndarray.workspace = true

[lints]
workspace = true

[[test]]
name = "api"
path = "tests/api.rs"
