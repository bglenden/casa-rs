[package]
name = "casa-calibration"
description = "Calibration-table compatibility and workflow substrate for casa-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
slow-tests = []

[dependencies]
casa-atmosphere = { path = "../casa-atmosphere" }
casa-components = { path = "../casa-components" }
casa-coordinates = { path = "../casa-coordinates" }
casa-images = { path = "../casa-images" }
casa-lattices = { path = "../casa-lattices" }
casa-fft = { path = "../casa-fft" }
casa-imaging-model = { path = "../casa-imaging-model" }
casa-imaging-operator = { path = "../casa-imaging-operator" }
casa-imaging-runtime = { path = "../casa-imaging-runtime" }
casa-imaging-singledish = { path = "../casa-imaging-singledish" }
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-measures-data = { path = "../casa-measures-data" }
casa-ms = { path = "../casa-ms" }
casa-numerics = { path = "../casa-numerics" }
casa-tables = { path = "../casa-tables" }
casa-types = { path = "../casa-types" }
libm = "0.2"
ndarray.workspace = true
num-complex.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sofars.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = "3"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
csv-core = "0.1.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
casa-logging = { path = "../casa-logging" }
casa-simulation = { path = "../casa-simulation" }
casa-ms = { path = "../casa-ms", features = ["msv4"] }
casa-observation = { path = "../casa-observation" }
flate2 = "1"
tar = "0.4"
casa-test-support = { path = "../casa-test-support" }
ndarray.workspace = true

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "flagdata"
path = "src/bin/flagdata.rs"

[[bin]]
name = "mstransform"
path = "src/bin/mstransform.rs"

[lints]
workspace = true
