[package]
name = "casa-dev-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Developer-only probes and dataset staging helpers (internal)"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
casa-tables.workspace = true
casa-measures.workspace = true
casa-ms = { path = "../../crates/casa-ms" }
casa-simulation = { path = "../../crates/casa-simulation" }
casa-core.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ms-read-probe"
path = "src/bin/ms-read-probe.rs"

[[bin]]
name = "package_snapshot"
path = "src/bin/package_snapshot.rs"

[[bin]]
name = "synthetic-ms"
path = "src/bin/synthetic-ms.rs"
