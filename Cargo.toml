[workspace]
resolver = "2"
members = [
    "crates/casa-notebook",
    "crates/casa-provider-contracts",
    "crates/casa-task-runtime",
    "crates/casars",
    "crates/casars-imager",
    "crates/casars-python",
    "crates/casars-frontend-services",
    "crates/casars-imagebrowser-protocol",
    "crates/casars-tablebrowser-protocol",
    "crates/casa-types",
    "crates/casa-vla",
    "crates/casa-values",
    "crates/casa-aipsio",
    "crates/casa-logging",
    "crates/casa-numerics",
    "crates/casa-fft",
    "crates/casa-calibration",
    "crates/casa-measures-tools",
    "crates/casa-tables",
    "crates/casa-lattices",
    "crates/casa-coordinates",
    "crates/casa-images",
    "crates/casa-imaging-model",
    "crates/casa-imaging-operator",
    "crates/casa-imaging-deconvolution",
    "crates/casa-imaging-reconstruction",
    "crates/casa-imaging-products",
    "crates/casa-imaging-application",
    "crates/casa-imaging-runtime",
    "crates/casa-imaging-metal",
    "crates/casa-simulation-synthesis",
    "crates/casa-measures-data",
    "crates/casa-test-support",
    "crates/casa-ms",
    "crates/ratatui-graphics",
]

[workspace.package]
version = "0.27.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.99"
description = "Rust implementation of casacore-compatible persistent data I/O"
repository = "https://github.com/bglenden/casa-rs"

[workspace.dependencies]
nalgebra = "0.33"
ndarray = "0.17"
num-complex = "0.4"
pkg-config = "0.3"
ratatui-graphics = { path = "crates/ratatui-graphics", default-features = false, features = ["panel", "plotters", "kitty"] }
sha2 = { version = "0.10", features = ["asm"] }
smallvec = "1.15"
sofars = "0.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Performance benchmarks compare Rust vs C++ (compiled optimized by cc::Build).
# Without these overrides, Rust tests run at opt-level=0 (debug), producing
# misleading 1000x+ ratios. Enable optimization for the hot-path crates and
# their key dependencies so perf comparisons are apples-to-apples.
[profile.test.package.sofars]
opt-level = 2
[profile.test.package.casa-types]
opt-level = 2
[profile.test.package.casa-tables]
opt-level = 2
[profile.test.package.casa-aipsio]
opt-level = 2
[profile.test.package.casa-ms]
opt-level = 2
[profile.test.package.casa-simulation-synthesis]
opt-level = 2
[profile.test.package.casa-test-support]
opt-level = 2

# Imaging end-to-end tests (T1 tier) must finish within about ten minutes on
# realistic sample counts; debug assertions stay on, optimisation is release-like.
[profile.test.package.casa-imaging-model]
opt-level = 3
[profile.test.package.casa-imaging-operator]
opt-level = 3
[profile.test.package.casa-imaging-deconvolution]
opt-level = 3
[profile.test.package.casa-imaging-reconstruction]
opt-level = 3
[profile.test.package.casa-imaging-products]
opt-level = 3
[profile.test.package.casa-imaging-runtime]
opt-level = 3
[profile.test.package.casa-imaging-metal]
opt-level = 3
[profile.test.package.casa-imaging-application]
opt-level = 3
[profile.test.package.casars-imager]
opt-level = 3
[profile.test.package.casa-fft]
opt-level = 3
[profile.test.package.casa-numerics]
opt-level = 3
[profile.test.package.ndarray]
opt-level = 2
[profile.test.package.nalgebra]
opt-level = 2
[profile.test.package.num-complex]
opt-level = 2

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
suspicious = "deny"
