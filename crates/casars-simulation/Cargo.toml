[package]
name = "casars-simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CASA-compatible simulation tasks: simobserve"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
casa-calibration = { path = "../casa-calibration" }
casa-components = { path = "../casa-components" }
casa-types = { path = "../casa-types" }
casa-tables = { path = "../casa-tables" }
casa-measures-data = { path = "../casa-measures-data" }
casa-ms = { path = "../casa-ms" }
casa-contracts = { path = "../../surfaces/casa-contracts" }
casa-simulation = { path = "../casa-simulation" }
casa-task-runtime = { path = "../casa-task-runtime" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "simobserve"
path = "src/main.rs"

[[bin]]
name = "simanalyze"
path = "src/simanalyze.rs"

[[bin]]
name = "simalma"
path = "src/simalma.rs"

[[bin]]
name = "predictcomp"
path = "src/predictcomp.rs"
