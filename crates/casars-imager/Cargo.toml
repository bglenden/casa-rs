[package]
name = "casars-imager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MeasurementSet-backed CASA-compatible imaging application"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-imaging-application = { path = "../casa-imaging-application" }
libc = "0.2"
casa-logging = { path = "../casa-logging" }
casa-ms = { path = "../casa-ms" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true

[dev-dependencies]
# The geometry-law example reads MSv4 conversions.
casa-ms = { path = "../casa-ms", features = ["msv4"] }
casa-coordinates = { path = "../casa-coordinates" }
casa-images = { path = "../casa-images" }
casa-numerics = { path = "../casa-numerics" }
casa-simulation-synthesis = { path = "../casa-simulation-synthesis" }
casa-test-support = { path = "../casa-test-support" }
casa-types = { path = "../casa-types" }
ndarray.workspace = true
tempfile = "3"
tracing-subscriber.workspace = true

[[bin]]
name = "casars-imager"
path = "src/main.rs"
