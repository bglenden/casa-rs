[package]
name = "casa-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Feature-gated task adapters, contracts, and CASA return projections for casa-rs"
repository.workspace = true
publish = false

[features]
default = []
imaging = [
    "dep:casa-images",
    "dep:casa-imaging-application",
    "dep:casa-ms",
    "dep:ndarray",
]
vla = ["dep:casa-ms", "dep:casa-vla"]

[lints]
workspace = true

[dependencies]
casa-contracts = { path = "../casa-contracts" }
casa-images = { path = "../../crates/casa-images", optional = true }
casa-imaging-application = { path = "../../crates/casa-imaging-application", optional = true }
casa-ms = { path = "../../crates/casa-ms", optional = true }
casa-task-runtime = { path = "../../crates/casa-task-runtime" }
casa-vla = { path = "../../crates/casa-vla", optional = true }
ndarray = { workspace = true, optional = true }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true

[dev-dependencies]
casa-imaging-deconvolution = { path = "../../crates/casa-imaging-deconvolution" }
casa-test-support = { path = "../../dev/casa-test-support" }
tempfile = "3"
