[package]
name = "casars-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings and package for casa-rs"
repository.workspace = true
publish = false

[lib]
name = "casars_python"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
casa-components = { path = "../casa-components" }
casa-coordinates = { path = "../casa-coordinates" }
casa-images = { path = "../casa-images" }
casa-ms = { path = "../casa-ms" }
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-simulation = { path = "../casa-simulation" }
casa-tables = { path = "../casa-tables" }
casa-task-runtime = { path = "../casa-task-runtime" }
casa-types = { path = "../casa-types" }
casars-imager = { path = "../casars-imager" }
casars-simulation = { path = "../casars-simulation" }
ndarray.workspace = true
num-complex.workspace = true
numpy = "0.28"
pyo3 = "0.28"
pythonize = "0.28"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
casa-calibration = { path = "../casa-calibration" }
casa-vla = { path = "../casa-vla" }
tempfile = "3"

[lints]
workspace = true
