[package]
name = "casars-frontend-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI service layer of the casa-rs Python package"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
camino = "1.2"
cargo_metadata = "0.19"
casa-ms = { path = "../casa-ms" }
casa-provider-contracts = { path = "../casa-provider-contracts" }
casa-task-runtime = { path = "../casa-task-runtime" }
casars-imager = { path = "../casars-imager" }
casars-simulation = { path = "../casars-simulation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
uniffi = "0.29.5"
uniffi_bindgen = "0.29.5"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
