name: Python Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  release_version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read workspace version and check release tag
        id: version
        shell: python
        run: |
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          base = r"(?:0|[1-9][0-9]*)"
          match = re.fullmatch(rf"({base}\.{base}\.{base})(?:-rc([0-9]+))?", version)
          if match is None:
              raise SystemExit(f"expected a workspace version of x.y.z or x.y.z-rcN, got {version!r}")

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"tag {ref!r} does not match Cargo workspace version {version!r}")

          # Maturin converts Cargo's -rcN to the PEP 440 spelling in Python metadata.
          python_version, rc = match.groups()
          if rc is not None:
              python_version += f"rc{int(rc)}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"python_version={python_version}", file=output)

  release_checks:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release_version
    uses: ./.github/workflows/ci.yml

  build_wheels:
    name: Build release assets (${{ matrix.platform }})
    needs: release_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: release-assets-linux-x86_64
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: macos-15
            artifact_name: release-assets-macos-arm64
            platform: macos-arm64
            target: aarch64-apple-darwin
            manylinux: off

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up smoke-test Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build SIMD FFTW from pinned source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y build-essential curl pkg-config
          fi
          prefix="$GITHUB_WORKSPACE/.native/fftw-host"
          bash scripts/build-fftw.sh "$prefix"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            bash scripts/build-fftw.sh "$(pwd)/.native/fftw-manylinux"
            export PKG_CONFIG_PATH="$(pwd)/.native/fftw-manylinux/lib/pkgconfig"
          args: --release --manifest-path frontends/casars-python/Cargo.toml --interpreter 3.10 3.11 3.12 --out dist

      - name: Build suite binaries
        shell: bash
        run: |
          set -euo pipefail
          while read -r package binary; do
            cargo build -q --release -p "$package" --bin "$binary"
          done < <(scripts/list-suite-binaries.py --package-binary)

      - name: Smoke-test built wheel
        shell: bash
        env:
          PYTHON_RELEASE_VERSION: ${{ needs.release_version.outputs.python_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*-cp312-*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "expected exactly one cp312 wheel, found ${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
          bash scripts/test-release-python-artifact.sh "${wheels[0]}" "$PYTHON_RELEASE_VERSION"

      - name: Package suite and standalone binary bundles
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package-suite-bundle.sh \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --bin-dir target/release \
            --wheel-dir dist \
            --out-dir dist

      - name: Include corresponding FFTW source and build recipe
        shell: bash
        run: |
          cp .native/fftw-host/source/fftw-3.3.11.tar.gz dist/
          cp scripts/build-fftw.sh dist/build-fftw.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  build_sdist:
    name: Build sdist
    needs: release_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          rust-toolchain: stable
          args: --manifest-path frontends/casars-python/Cargo.toml --out dist

      - name: Smoke-test built sdist
        shell: bash
        env:
          PYTHON_RELEASE_VERSION: ${{ needs.release_version.outputs.python_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one sdist, found ${#sdists[@]}" >&2
            printf '%s\n' "${sdists[@]}" >&2
            exit 1
          fi
          bash scripts/test-release-python-artifact.sh "${sdists[0]}" "$PYTHON_RELEASE_VERSION"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release_checks, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          pattern: python-sdist
          path: python-dist
          merge-multiple: true

      - name: Add installer script asset
        run: |
          cp scripts/install-suite.sh release-dist/install-casa-rs.sh
          cp python-dist/* release-dist/

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Set up Python for PyPI upload
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -z "${MATURIN_PYPI_TOKEN:-}" ]]; then
            echo "PYPI_API_TOKEN is not configured; GitHub release assets were published only."
            exit 0
          fi

          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.7,<2'
          maturin upload --non-interactive python-dist/*

      - name: Skip PyPI upload for prerelease tags
        if: ${{ contains(github.ref_name, '-') }}
        run: echo "Prerelease tag detected; GitHub release assets were published but PyPI upload was intentionally skipped."
