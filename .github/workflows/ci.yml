name: CI

on:
  schedule:
    # Check main broadly and refresh the build caches once per night.
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted checks to run
        type: choice
        options: [affected, static, full]
        default: affected
      base_sha:
        description: Full merge-base commit SHA (required for affected checks)
        type: string
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.scope || 'full' }}-${{ inputs.base_sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci_scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      python: ${{ steps.plan.outputs.python }}
      docs: ${{ steps.plan.outputs.docs }}
      perf: ${{ steps.plan.outputs.perf }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'affected' && github.ref_type == 'branch'
      - name: Select checks
        id: plan
        shell: bash
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == branch ]]; then
            case "$CI_SCOPE" in
              affected) args+=(--base "$CI_BASE_SHA") ;;
              static) args+=(--static) ;;
              full) ;;
              *) echo "Select affected, static or full checks" >&2; exit 1 ;;
            esac
          fi
          python3 -B scripts/test-ci-scope.py
          python3 scripts/ci_scope.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Fail the workflow if a selected check did not run successfully.
  lint_test:
    if: ${{ always() }}
    needs: [ci_scope, rust_checks, python_package, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected checks
        env:
          SCOPE_RESULT: ${{ needs.ci_scope.result }}
          RUST_RESULT: ${{ needs.rust_checks.result }}
          PYTHON_SELECTED: ${{ needs.ci_scope.outputs.python != 'none' }}
          PYTHON_RESULT: ${{ needs.python_package.result }}
          DOCS_SELECTED: ${{ needs.ci_scope.outputs.docs == 'true' }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          check_job() {
            local expected=skipped
            if [[ "$2" == true ]]; then expected=success; fi
            echo "$1: $3 (expected $expected)" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$3" == "$expected" ]]
          }

          failed=0
          check_job scope true "$SCOPE_RESULT" || failed=1
          check_job rust true "$RUST_RESULT" || failed=1
          check_job python "$PYTHON_SELECTED" "$PYTHON_RESULT" || failed=1
          check_job docs "$DOCS_SELECTED" "$DOCS_RESULT" || failed=1
          exit "$failed"

  rust_checks:
    needs: ci_scope
    runs-on: ubuntu-latest
    env:
      # Line tables keep file:line in panic backtraces while avoiding full
      # debug info in ~130 linked test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The restored cache and a rebuild of what a change to a low-level crate
      # invalidates sit side by side, which can fill the runner's disk: the
      # runner then dies with no log (#1115, #1119). These tools go unused here.
      - name: Free disk space
        if: needs.ci_scope.outputs.rust != 'static'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # arch-check resolves the reviewed CASA-compatibility evidence at
          # its pinned commits (scripts/casa_compat_semantics.py).
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for Rust tests
        if: needs.ci_scope.outputs.rust != 'static'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NumPy for Rust tests
        if: needs.ci_scope.outputs.rust != 'static'
        run: python -m pip install 'numpy>=2,<3'

      # PyO3 configures itself once per build cache: the restored cache keeps
      # the library directory of the interpreter it was built with. Naming
      # the interpreter by its versioned path makes PyO3 configure itself
      # again when "3.12" moves to a new patch release (PYO3_PYTHON is one of
      # its rerun triggers); a fixed `python3` linked against a directory
      # the new runner no longer has.
      - name: Point PyO3 at the interpreter installed
        if: needs.ci_scope.outputs.rust != 'static'
        run: echo "PYO3_PYTHON=$pythonLocation/bin/python3" >> "$GITHUB_ENV"

      - name: Install FFTW development libraries
        if: needs.ci_scope.outputs.rust != 'static'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        if: needs.ci_scope.outputs.rust != 'static'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check architecture
        run: scripts/arch-check.sh

      - name: Check SPDX license headers
        run: scripts/check-spdx.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install explicit measures runtime for integration tests
        if: needs.ci_scope.outputs.rust != 'static'
        run: |
          mkdir -p "$RUNNER_TEMP/casa-measures"
          tar -xzf libs/casacore/casa-measures/data/casa-measures-runtime.tar.gz -C "$RUNNER_TEMP/casa-measures"
          cp libs/casacore/casa-measures/data/casa-measures-runtime.provenance.json "$RUNNER_TEMP/casa-measures/.casa-rs-measures-provenance.json"
          echo "CASA_RS_MEASURESPATH=$RUNNER_TEMP/casa-measures" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        if: needs.ci_scope.outputs.rust != 'static'
        uses: taiki-e/install-action@nextest

      - name: Lint and test selected packages
        if: needs.ci_scope.outputs.rust != 'static'
        env:
          RUST_SCOPE: ${{ needs.ci_scope.outputs.rust }}
          AFFECTED_PACKAGES: ${{ needs.ci_scope.outputs.packages }}
          NEXTEST_PROFILE: ci
          # Debug builds of the bounded imaging stack legitimately exceed the
          # default test-thread stack; production uses release frames.
          RUST_MIN_STACK: 33554432
        run: |
          if [[ "$RUST_SCOPE" == full ]]; then
            scope=(--workspace)
          else
            read -r -a packages <<< "$AFFECTED_PACKAGES"
            test "${#packages[@]}" -gt 0
            scope=()
            for package in "${packages[@]}"; do scope+=(--package "$package"); done
          fi
          cargo clippy "${scope[@]}" --all-targets --keep-going -- -D warnings
          scripts/test-workspace.sh "${scope[@]}"

  python_package:
    needs: ci_scope
    if: needs.ci_scope.outputs.python != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test Python package
        env:
          PYTHON_SCOPE: ${{ needs.ci_scope.outputs.python }}
        run: |
          if [[ "$PYTHON_SCOPE" == editable ]]; then
            scripts/test-python-package.sh --plot --editable-only
          else
            scripts/test-python-package.sh --plot
          fi

  perf_tools:
    needs: ci_scope
    if: needs.ci_scope.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the tool tests' dependencies
        run: python -m pip install pytest numpy scipy matplotlib astropy

      - name: Test the imaging performance tools
        run: scripts/test-perf-tools.sh

  docs:
    needs: ci_scope
    if: needs.ci_scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        if: needs.ci_scope.outputs.rust == 'full'
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        if: needs.ci_scope.outputs.rust == 'full'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        if: needs.ci_scope.outputs.rust == 'full'
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        if: needs.ci_scope.outputs.rust == 'full'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check repository docs and generated references
        run: scripts/docs-check.sh

      - name: Build public and private rustdoc
        if: needs.ci_scope.outputs.rust == 'full'
        # The public build never resolves links in private items; this one
        # does, with the same lints (#805). Keep the public build too: only
        # it reports a public item that links to a private one.
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --document-private-items

      - name: Build MkDocs site
        if: needs.ci_scope.outputs.rust == 'full'
        run: scripts/build-python-docs.sh site

  smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run smoke gate
        run: scripts/test-smoke.sh

  # Exercise the installed release binaries and Python with the checkout moved aside.
  suite_install:
    needs: ci_scope
    if: needs.ci_scope.outputs.rust == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFTW development libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main saves; pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test suite installer
        run: scripts/test-install-suite.sh --hide-checkout

  coverage:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install explicit measures runtime for coverage tests
        run: |
          mkdir -p "$RUNNER_TEMP/casa-measures"
          tar -xzf libs/casacore/casa-measures/data/casa-measures-runtime.tar.gz -C "$RUNNER_TEMP/casa-measures"
          cp libs/casacore/casa-measures/data/casa-measures-runtime.provenance.json "$RUNNER_TEMP/casa-measures/.casa-rs-measures-provenance.json"
          echo "CASA_RS_MEASURESPATH=$RUNNER_TEMP/casa-measures" >> "$GITHUB_ENV"

      - name: Run coverage (line)
        run: scripts/run-coverage.sh --ci-like
