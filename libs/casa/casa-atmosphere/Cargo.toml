[package]
publish = true
autotests = false
name = "casa-atmosphere"
description = "Native port of ATM, the atmospheric transmission model CASA uses for opacity and sky brightness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["radio-astronomy", "atmosphere", "radiative-transfer"]
categories = ["science"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
num-complex.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true

[[test]]
name = "api"
path = "tests/api.rs"

[[test]]
name = "allocation"
path = "tests/allocation.rs"
