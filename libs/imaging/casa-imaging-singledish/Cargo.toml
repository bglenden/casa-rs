[package]
name = "casa-imaging-singledish"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Single-dish image-plane gridding: CASA's SDGrid kernels, gridder and degridder, and the theoretical beam"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["single-dish", "gridding", "radio-astronomy"]
categories = ["science"]
publish = true
autotests = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
casa-imaging-operator.workspace = true
casa-imaging-runtime.workspace = true
casa-numerics.workspace = true
libm = "0.2"
ndarray.workspace = true
num-complex.workspace = true
thiserror.workspace = true

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "api"
path = "tests/api.rs"

[[test]]
name = "grid_memory"
path = "tests/grid_memory.rs"
