[package]
name = "casa-measures"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runtime data and table columns for casacore measures"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["casacore", "astronomy", "ephemerides"]
categories = ["science"]
publish = true
exclude = ["data/casa-measures-runtime.tar.gz"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[features]
update = ["dep:ureq"]

[dependencies]
casa-tables.workspace = true
casa-core.workspace = true
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
