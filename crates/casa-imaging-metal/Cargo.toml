[package]
name = "casa-imaging-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Metal implementation of the imaging gridding backend (macOS only)"
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Local #991 GPU rounding-loss correction experiment; not production adoption.
compensated-f32-prototype = []

[dependencies]
casa-imaging-operator = { path = "../casa-imaging-operator" }
casa-numerics = { path = "../casa-numerics" }
num-complex.workspace = true

[target.'cfg(all(target_os = "macos", not(coverage)))'.dependencies]
tracing.workspace = true
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]
casa-imaging-model = { path = "../casa-imaging-model" }
casa-types = { path = "../casa-types" }
ndarray.workspace = true
num-complex.workspace = true
