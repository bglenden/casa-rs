[package]
name = "casars-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings and package for casa-rs"
repository.workspace = true
publish = false

[lib]
name = "casars_python"
crate-type = ["cdylib"]

[features]
transform-test-hooks = ["casa-mstransform/transform-test-hooks"]
flagdata-test-hooks = ["casa-flagging/flagdata-test-hooks"]
imstat-test-hooks = ["casa-imageanalysis/imstat-test-hooks"]
extension-module = ["pyo3/extension-module"]

[dependencies]
casa-imageanalysis.workspace = true
casa-flagging.workspace = true
casa-mstransform.workspace = true
casa-atmosphere.workspace = true
casa-calibration.workspace = true
casa-singledish.workspace = true
casa-components.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-measures.workspace = true
casa-ms.workspace = true
casa-contracts = { path = "../../surfaces/casa-contracts" }
casa-plot-data = { path = "../../surfaces/casa-plot-data", features = ["ms", "simulation"] }
casa-simulation.workspace = true
casa-tables.workspace = true
casa-tasks = { path = "../../surfaces/casa-tasks", features = ["calibration", "imaging", "images", "ms", "simulation", "vla"] }
casa-core.workspace = true
ndarray.workspace = true
num-complex.workspace = true
numpy = "0.28"
# `multiple-pymethods`: a CASA tool's methods are declared across files, its
# generated refusals apart from what it implements (#1025).
pyo3 = { version = "0.28", features = ["multiple-pymethods"] }
pythonize = "0.28"
regex = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
