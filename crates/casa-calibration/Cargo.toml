[package]
name = "casa-calibration"
description = "Calibration-table compatibility and workflow substrate for casa-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
slow-tests = []

[dependencies]
casa-imageanalysis.workspace = true
casa-atmosphere = { path = "../casa-atmosphere" }
casa-components.workspace = true
casa-coordinates.workspace = true
casa-images.workspace = true
casa-lattices.workspace = true
casa-fft.workspace = true
casa-imaging-model = { path = "../casa-imaging-model" }
casa-imaging-operator = { path = "../casa-imaging-operator" }
casa-imaging-runtime = { path = "../casa-imaging-runtime" }
casa-imaging-singledish = { path = "../casa-imaging-singledish" }
casa-measures.workspace = true
casa-ms = { path = "../casa-ms" }
casa-numerics.workspace = true
casa-tables.workspace = true
casa-core.workspace = true
libm = "0.2"
ndarray.workspace = true
num-complex.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sofars.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = "3"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
csv-core = "0.1.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
casa-simulation = { path = "../casa-simulation" }
casa-ms = { path = "../casa-ms", features = ["msv4"] }
casa-observation.workspace = true
flate2 = "1"
tar = "0.4"
casa-test-support = { path = "../../dev/casa-test-support" }
ndarray.workspace = true

[lints]
workspace = true
