[package]
name = "casa-imageanalysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CASA image analysis, regridding and component-list images"
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
casa-images.workspace = true
casa-components.workspace = true
casa-fft.workspace = true
casa-coordinates.workspace = true
casa-lattices.workspace = true
casa-numerics.workspace = true
casa-tables.workspace = true
casa-core.workspace = true
fitsio = { version = "0.21", features = ["fitsio-src", "src-cmake"] }
ndarray.workspace = true
num-complex.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
casa-test-support = { path = "../../../dev/casa-test-support" }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
