[workspace]
resolver = "2"
members = [
    "surfaces/casa-contracts",
    "surfaces/casa-plot-data",
    "surfaces/casa-tasks",
    "frontends/casars-cli",
    "frontends/casars-python",
    "libs/casacore/casa-core",
    "crates/casa-vla",
    "libs/casacore/casa-aipsio",
    "libs/casacore/casa-numerics",
    "libs/casacore/casa-fft",
    "crates/casa-calibration",
    "crates/casa-components",
    "libs/casacore/casa-tables",
    "libs/casacore/casa-lattices",
    "libs/casacore/casa-coordinates",
    "crates/casa-images",
    "crates/casa-imaging-model",
    "crates/casa-imaging-operator",
    "crates/casa-imaging-deconvolution",
    "crates/casa-imaging-products",
    "crates/casa-imaging-application",
    "crates/casa-imaging-runtime",
    "crates/casa-imaging-singledish",
    "crates/casa-imaging-metal",
    "crates/casa-simulation",
    "crates/casa-atmosphere",
    "libs/casacore/casa-measures",
    "crates/casa-ms",
    "libs/casacore/casa-observation",
    "dev/casa-test-support",
    "dev/casa-dev-tools",
    "suites/casacore-interop",
    "suites/casa-parity",
    "suites/perf",
]

[workspace.package]
version = "0.27.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.99"
description = "Rust implementation of casacore-compatible persistent data I/O"
repository = "https://github.com/bglenden/casa-rs"

[workspace.dependencies]
casa-aipsio = { path = "libs/casacore/casa-aipsio", version = "0.27.0" }
casa-coordinates = { path = "libs/casacore/casa-coordinates", version = "0.27.0" }
casa-core = { path = "libs/casacore/casa-core", version = "0.27.0" }
casa-fft = { path = "libs/casacore/casa-fft", version = "0.27.0" }
casa-lattices = { path = "libs/casacore/casa-lattices", version = "0.27.0" }
casa-measures = { path = "libs/casacore/casa-measures", version = "0.27.0" }
casa-numerics = { path = "libs/casacore/casa-numerics", version = "0.27.0" }
casa-observation = { path = "libs/casacore/casa-observation", version = "0.27.0" }
casa-tables = { path = "libs/casacore/casa-tables", version = "0.27.0" }
nalgebra = "0.33"
ndarray = "0.17"
num-complex = "0.4"
pkg-config = "0.3"
sha2 = { version = "0.10", features = ["asm"] }
smallvec = "1.15"
sofars = "0.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Performance benchmarks compare Rust vs C++ (compiled optimized by cc::Build).
# Without these overrides, Rust tests run at opt-level=0 (debug), producing
# misleading 1000x+ ratios. Enable optimization for the hot-path crates and
# their key dependencies so perf comparisons are apples-to-apples.
[profile.test.package.sofars]
opt-level = 2
[profile.test.package.casa-core]
opt-level = 2
[profile.test.package.casa-tables]
opt-level = 2
[profile.test.package.casa-aipsio]
opt-level = 2
[profile.test.package.casa-ms]
opt-level = 2
[profile.test.package.casa-simulation]
opt-level = 2
# The ATM oracle tests evaluate every species over hundreds of frequencies.
[profile.test.package.casa-atmosphere]
opt-level = 3
[profile.test.package.casa-test-support]
opt-level = 2
[profile.test.package.casacore-interop]
opt-level = 2
[profile.test.package.casa-perf-suite]
opt-level = 2

# Imaging end-to-end tests (T1 tier) must finish within about ten minutes on
# realistic sample counts; debug assertions stay on, optimisation is release-like.
[profile.test.package.casa-imaging-model]
opt-level = 3
[profile.test.package.casa-imaging-operator]
opt-level = 3
[profile.test.package.casa-imaging-deconvolution]
opt-level = 3
[profile.test.package.casa-imaging-products]
opt-level = 3
[profile.test.package.casa-imaging-runtime]
opt-level = 3
[profile.test.package.casa-imaging-metal]
opt-level = 3
[profile.test.package.casa-imaging-application]
opt-level = 3
[profile.test.package.casa-tasks]
opt-level = 3
[profile.test.package.casars-cli]
opt-level = 3
[profile.test.package.casa-fft]
opt-level = 3
[profile.test.package.casa-numerics]
opt-level = 3
[profile.test.package.ndarray]
opt-level = 2
[profile.test.package.nalgebra]
opt-level = 2
[profile.test.package.num-complex]
opt-level = 2

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
suspicious = "deny"
# Functions stay under clippy.toml's code-line threshold. A function over it
# carries `#[expect(clippy::too_many_lines, reason = ...)]` naming its
# tracking issue, so splitting it fails the build until the expectation goes.
too_many_lines = "deny"
