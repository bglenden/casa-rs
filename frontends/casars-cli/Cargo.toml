[package]
name = "casars-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified CLI frontend binaries for casa-rs tasks"
repository.workspace = true
publish = false
autotests = false

[features]
default = ["calibration", "imaging", "images", "ms", "simulation", "vla"]
calibration = ["ms", "casa-tasks/calibration"]
imaging = ["casa-tasks/imaging", "dep:casa-imaging", "dep:libc"]
images = ["casa-tasks/images"]
ms = ["casa-tasks/ms"]
simulation = ["ms", "casa-tasks/simulation"]
vla = ["casa-tasks/vla"]
slow-tests = []

[lints]
workspace = true

[dependencies]
casa-contracts = { path = "../../surfaces/casa-contracts" }
casa-imaging = { workspace = true, optional = true }
casa-tables.workspace = true
casa-tasks = { path = "../../surfaces/casa-tasks" }
libc = { version = "0.2", optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
casa-imageanalysis.workspace = true
casa-flagging.workspace = true
casa-mstransform = { workspace = true, features = ["msv4"] }
casa-measures.workspace = true
base64 = "0.22"
casa-calibration = { path = "../../crates/casa-calibration" }
casa-coordinates.workspace = true
casa-images.workspace = true
casa-imaging-deconvolution.workspace = true
casa-lattices.workspace = true
casa-ms = { workspace = true, features = ["msv4"] }
casa-numerics.workspace = true
casa-plot-data = { path = "../../surfaces/casa-plot-data", features = ["ms"] }
casa-simulation = { path = "../../crates/casa-simulation" }
casa-test-support = { path = "../../dev/casa-test-support" }
casa-core.workspace = true
fitsio = { version = "0.21", features = ["fitsio-src", "src-cmake"] }
flate2 = "1"
ndarray.workspace = true
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
tempfile = "3"

[[bin]]
name = "casars-imager"
path = "src/bin/casars-imager.rs"
required-features = ["imaging"]

